  <!-- 03 HOW IT WAS DELIVERED -->
  <section data-screen-label="03 Delivery" data-chapter="Delivery" style="min-height:100vh; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; padding:120px 5% 80px; background:#f5f9fc;">
    <div style="width:100%; max-width:1220px; margin:0 auto;">
      <div data-reveal style="opacity:1; font-family:'Inter',system-ui,sans-serif; font-size:0.8rem; color:#bdbdbd; margin-bottom:0.9rem;">03</div>
      <h2 data-reveal data-delay="60" style="opacity:1; font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(1.75rem,3vw,2.5rem); line-height:1.25; color:#333333; margin:0;">From the shop floor to production</h2>
      <div data-reveal data-delay="60" data-rule style="opacity:1; width:60px; height:3px; background:#00ff9d; margin:15px 0 1.4rem;"></div>

      <p data-reveal data-delay="120" style="opacity:1; font-family:'Poppins',sans-serif; font-size:1.05rem; line-height:1.7; color:#555555; max-width:70ch; margin:0 0 2rem;">How a request moves from an idea to production, and back again.</p>

      <!-- The delivery workflow -->
      <figure data-reveal data-delay="170" style="opacity:1; margin:0;">
        <div style="background:#ffffff; border:1px solid #e0e0e0; padding:22px 26px;">
          <svg viewBox="0 0 1500 1080" style="width:100%; height:auto; display:block;" role="img" aria-label="Software development workflow. Phase 1 discovery and design: ideate, backlog, discovery, prototype, architecture. Phase 2 build, release and operate on the DevOps loop. Live feedback re-enters the backlog as a new item.">
            <defs>
              <marker id="wfArr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#004d4d"></path></marker>
            </defs>

            <!-- card 1 -->
            <rect x="14" y="52" width="268" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0"></rect>
            <circle cx="48" cy="88" r="13" fill="#00c97b"></circle>
            <text x="48" y="93" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="13" fill="#004d4d">1</text>
            <text x="70" y="93" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.1em" fill="#004d4d">IDEATE</text>
            <g font-family="'Poppins',sans-serif" font-size="13.5" fill="#333333">
              <text x="36" y="126">Collaborate and brainstorm</text>
              <text x="36" y="146">ideas</text>
            </g>

            <!-- card 2 -->
            <rect x="317" y="52" width="268" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0"></rect>
            <circle cx="351" cy="88" r="13" fill="#00c97b"></circle>
            <text x="351" y="93" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="13" fill="#004d4d">2</text>
            <text x="373" y="93" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.1em" fill="#004d4d">BACKLOG</text>
            <g font-family="'Poppins',sans-serif" font-size="13.5" fill="#333333">
              <text x="339" y="126">add the project into the</text>
              <text x="339" y="146">agile management tool</text>
            </g>
            <image href="assets/tech/clickup.svg" x="339" y="306" width="20" height="20" preserveAspectRatio="xMidYMid meet"></image>
            <text x="365" y="321" font-family="'Poppins',sans-serif" font-size="12.5" fill="#557069">ClickUp</text>

            <!-- card 3 -->
            <rect x="620" y="52" width="268" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0"></rect>
            <circle cx="654" cy="88" r="13" fill="#00c97b"></circle>
            <text x="654" y="93" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="13" fill="#004d4d">3</text>
            <text x="676" y="93" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.1em" fill="#004d4d">DISCOVERY</text>
            <g font-family="'Poppins',sans-serif" font-size="13.5" fill="#333333">
              <text x="642" y="126">Collection existing</text>
              <text x="642" y="146">implementation, speak with</text>
              <text x="642" y="166">associated people, gather</text>
              <text x="642" y="186">information on available</text>
              <text x="642" y="206">data sources.</text>
            </g>
            <image href="assets/tech/googlesheets.svg" x="642" y="252" width="20" height="20" preserveAspectRatio="xMidYMid meet"></image>
            <text x="668" y="267" font-family="'Poppins',sans-serif" font-size="12.5" fill="#557069">Spreadsheets</text>
            <image href="assets/tech/microsoftsqlserver.svg" x="642" y="280" width="20" height="20" preserveAspectRatio="xMidYMid meet"></image>
            <text x="668" y="295" font-family="'Poppins',sans-serif" font-size="12.5" fill="#557069">SQL databases</text>
            <image href="assets/tech/crystalreports.svg" x="642" y="308" width="20" height="20" preserveAspectRatio="xMidYMid meet"></image>
            <text x="668" y="323" font-family="'Poppins',sans-serif" font-size="12.5" fill="#557069">Existing reports</text>

            <!-- card 4 -->
            <rect x="923" y="52" width="268" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0"></rect>
            <circle cx="957" cy="88" r="13" fill="#00c97b"></circle>
            <text x="957" y="93" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="13" fill="#004d4d">4</text>
            <text x="979" y="93" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.1em" fill="#004d4d">PROTOTYPE</text>
            <g font-family="'Poppins',sans-serif" font-size="13.5" fill="#333333">
              <text x="945" y="126">Ideate the features needed,</text>
              <text x="945" y="146">create a mock prototype of</text>
              <text x="945" y="166">the expected result. Speak</text>
              <text x="945" y="186">with the respective people</text>
              <text x="945" y="206">to confirm we are all on the</text>
              <text x="945" y="226">same page and the prototype</text>
              <text x="945" y="246">is meeting their expectation</text>
            </g>
            <image href="assets/tech/figma.svg" x="947" y="306" width="18" height="20" preserveAspectRatio="xMidYMid meet"></image>
            <text x="971" y="321" font-family="'Poppins',sans-serif" font-size="12.5" fill="#557069">Figma</text>

            <!-- card 5 (highlighted) -->
            <rect x="1226" y="52" width="268" height="300" rx="10" fill="#004d4d"></rect>
            <circle cx="1260" cy="88" r="13" fill="#00e08f"></circle>
            <text x="1260" y="93" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="13" fill="#004d4d">5</text>
            <text x="1282" y="93" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.1em" fill="#00e08f">ARCHITECTURE</text>
            <g font-family="'Poppins',sans-serif" font-size="13.5" fill="#eaf5f1">
              <text x="1248" y="126">High Level System Design</text>
              <text x="1248" y="146">and Low Level System</text>
              <text x="1248" y="166">design</text>
            </g>
            <text x="1248" y="330" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="600" fill="#00ff9d">Signed off before the first sprint</text>

            <!-- inter-card arrows -->
            <g stroke="#004d4d" stroke-width="1.6">
              <line x1="288" y1="200" x2="309" y2="200" marker-end="url(#wfArr)"></line>
              <line x1="591" y1="200" x2="612" y2="200" marker-end="url(#wfArr)"></line>
              <line x1="894" y1="200" x2="915" y2="200" marker-end="url(#wfArr)"></line>
              <line x1="1197" y1="200" x2="1218" y2="200" marker-end="url(#wfArr)"></line>
            </g>

            <!-- design handoff into the sprint -->
            <path d="M1360,352 L1360,432 L760,432 L760,468" fill="none" stroke="#004d4d" stroke-width="1.6" marker-end="url(#wfArr)"></path>
            <text x="1064" y="424" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.1em" fill="#9aa7a3">DESIGN HANDOFF INTO THE SPRINT</text>

            <!-- ===== PHASE 2 HEADER (left) ===== -->
            <rect x="96" y="400" width="42" height="3" fill="#00ff9d"></rect>
            <text x="96" y="430" font-family="'Inter',system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="0.12em" fill="#37605a">PHASE 2 &middot; BUILD, RELEASE &amp; OPERATE</text>
            <text x="96" y="454" font-family="'Poppins',sans-serif" font-size="13" fill="#9aa7a3">Continuous delivery cycle, repeated each sprint.</text>

            <!-- ===== DEVOPS LOOP (image) ===== -->
            <image href="assets/devops.png" x="410" y="470" width="700" height="467" preserveAspectRatio="xMidYMid meet"></image>

            <!-- live feedback -->
            <path d="M760,940 L760,962" fill="none" stroke="#004d4d" stroke-width="1.6" marker-end="url(#wfArr)"></path>
            <text x="776" y="956" font-family="'Inter',system-ui,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.1em" fill="#9aa7a3">LIVE FEEDBACK</text>

            <!-- ===== FEEDBACK BOX ===== -->
            <rect x="470" y="964" width="580" height="92" rx="10" fill="#f4faf7" stroke="#d6e7df"></rect>
            <rect x="470" y="964" width="6" height="92" rx="3" fill="#00c97b"></rect>
            <text x="496" y="998" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#007a55">FEEDBACK LOOP</text>
            <text x="496" y="1026" font-family="'Poppins',sans-serif" font-size="14" fill="#333333">Feedback, change in user requirements, request for modification</text>

            <!-- side notes -->
            <circle cx="1086" cy="990" r="4" fill="#00c97b"></circle>
            <g font-family="'Poppins',sans-serif" font-size="11.5" fill="#557069">
              <text x="1102" y="988">Phase 1 runs once per project.</text>
              <text x="1102" y="1006">Phase 2 repeats every sprint.</text>
            </g>
            <circle cx="1086" cy="1034" r="4" fill="#004d4d"></circle>
            <g font-family="'Poppins',sans-serif" font-size="11.5" fill="#557069">
              <text x="1102" y="1032">Requirement changes never</text>
              <text x="1102" y="1050">bypass the backlog; they re-enter at step 2.</text>
            </g>

            <!-- re-enters the backlog (dashed return) -->
            <path d="M470,1010 L40,1010 L40,388 L451,388 L451,356" fill="none" stroke="#004d4d" stroke-width="1.5" stroke-dasharray="3 6" marker-end="url(#wfArr)"></path>
            <text x="255" y="1002" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.1em" fill="#9aa7a3">RE-ENTERS THE BACKLOG AS A NEW ITEM</text>
          </svg>
        </div>
        <figcaption style="font-family:'Poppins',sans-serif; font-size:0.85rem; color:#757575; margin-top:12px; line-height:1.5;">The same workflow runs whether the task is a payslip calculation or a production dashboard. Keeping it disciplined and repeatable is what has let delivery stay predictable as the platform has grown.</figcaption>
      </figure>

  </section>
