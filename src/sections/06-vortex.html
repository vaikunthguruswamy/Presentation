    <script>
      (function () {
        var root = document.currentScript.closest('section');
        if (!root) return;
        var frame = root.querySelector('[data-vortex-frame]');
        var urlBar = root.querySelector('[data-vortex-url]');
        var openLink = root.querySelector('[data-vortex-open]');
        var btns = root.querySelectorAll('[data-vortex-btn]');
        btns.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var src = btn.getAttribute('data-src');
            if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
            if (urlBar) urlBar.textContent = btn.getAttribute('data-url');
            if (openLink) openLink.setAttribute('href', src);
            btns.forEach(function (b) {
              var on = b === btn;
              b.setAttribute('data-active', on ? 'true' : 'false');
              b.style.background = on ? '#00ff9d' : '#004d4d';
              b.style.color = on ? '#004d4d' : '#ffffff';
              b.style.fontWeight = on ? '600' : '500';
            });
          });
        });
      })();
    </script>
